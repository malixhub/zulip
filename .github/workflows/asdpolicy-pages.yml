name: ASDPolicy UI Preview

on:
  push:
    branches: [asdpolicy-ui]
    paths:
      - "asdpolicy-preview/**"
      - ".github/workflows/asdpolicy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: asdpolicy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the static UI prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./asdpolicy-preview
      - name: Publish UI prototype
        id: deployment
        uses: actions/deploy-pages@v4
